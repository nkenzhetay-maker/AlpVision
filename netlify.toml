[build]
  functions = "functions"

# /api/* → /.netlify/functions/* yönlendirmesi
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."generate-bg"]
  timeout = 26

[functions."analyze"]
  timeout = 26

[functions."vision-qc"]
  timeout = 26

[functions."analyze-fast"]
  timeout = 10

[functions."analyze-deep"]
  timeout = 26
